# Cloud Build config for the execution worker (R2B).
#
# Submit with:
#   gcloud builds submit \
#     --config worker/cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/ai-workforce-agents/execution-worker/execution-worker:<tag>,_REGION=us-central1 \
#     --project=ai-workforce-agents \
#     .
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--tag=${_IMAGE}"
      - "--file=worker/Dockerfile"
      - "."
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/ai-workforce-agents/execution-worker/execution-worker:latest"
