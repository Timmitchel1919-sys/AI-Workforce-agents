<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/brand/app-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workforce</title>
    <!-- Obsidian before any CSS/JS loads, so the splash never follows a white flash. -->
    <style>html { background: #02040a; }</style>
    <!-- Apply the saved theme + language before first paint (no flash of the wrong theme or language).
         Values are allowlisted; anything else falls back to defaults. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("ai-workforce-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var lang = localStorage.getItem("ai-workforce-language");
          if (lang !== "en" && lang !== "nl") {
            var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
            lang = nav.toLowerCase().indexOf("nl") === 0 ? "nl" : "en";
          }
          root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
