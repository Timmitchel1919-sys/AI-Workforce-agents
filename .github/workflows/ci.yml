name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Verify lockfile integrity
        run: npm run security:lockfile

      - name: Secret scan
        run: npm run security:secrets

      - name: SAST scan
        run: npm run security:sast

      - name: Dependency scan
        run: npm run security:deps

      - name: License audit
        run: npm run security:licenses

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npm run security:sbom

# No secrets or AI provider credentials are required or referenced by this workflow.
